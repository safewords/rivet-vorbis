name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      # The baseline build of every kernel, without the run-time selection
      # of the AVX2 ones (on arm64 the same NEON build either way).
      - name: Tests, scalar kernels only
        run: cargo test --release --features force-scalar

  # The Xiph.Org test vectors are fetched (not committed) and checked
  # against the SHA-256 manifest in tests/vectors/; the suite then decodes
  # every one strictly where the format allows it. Without them on disk the
  # vector tests skip, so this job fetches them and makes their absence an error.
  vectors:
    name: Xiph.Org test vectors
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/fetch-vectors.sh
      - name: Tests
        run: cargo test --release --test vectors
        env:
          VORBIS_REQUIRE_VECTORS: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features force-scalar -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
