[package]
name = "rivet-vorbis"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-vorbis"
homepage = "https://github.com/safewords/rivet-vorbis"
documentation = "https://docs.rs/rivet-vorbis"
authors = ["Ely Erin Fox"]
description = "A Vorbis I decoder and encoder in Rust, with an Ogg (RFC 3533) reader and writer, written from the Vorbis I specification: no C, no system libraries, no build script. Floor 0 and 1, residues 0/1/2, every mapping; a psychoacoustic encoder with floor 1, residue 2, polar coupling and block switching. rivet's Vorbis codec. Imported as `vorbis`."
keywords = ["vorbis", "ogg", "audio", "decoder", "encoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/", "docs/", "tools/"]

[lib]
name = "vorbis"

[dependencies]
thiserror = "2"

# The round-trip and test-vector suites decode and encode minutes of audio;
# unoptimised they take far longer than they need to.
[profile.test]
opt-level = 3
